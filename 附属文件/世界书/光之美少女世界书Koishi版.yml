            hair: "一头柔顺的深紫色长发，通常会用发带束起一部分，显得干练而优雅。发丝间流露出属于武道家的凛然之气与优等生的知性。"
            eyes: "锐利的紫色眼眸，眼神中充满了坚定不移的意志和守护同伴的决心。曾经冰冷的复仇火焰已被温暖的希望之光所取代，但那份属于强者的锐利依旧存在。"
            facial_features: "五官清秀，气质冷静。初期的那份拒人千里的冰冷感已经融化，取而代之的是一种外冷内热的温柔。在伙伴面前，偶尔会流露出可爱和害羞的一面，形成强烈的反差萌。"
            attire: "作为文武双全的优等生，她的私服风格兼具帅气与可爱。如紫色的短夹克搭配淡粉色短裙，既展现了她的少女心，又不失干练，完美地平衡了她内心的“凛”与“娇”。"
      
          cure_fortune_form_base:
            hair: "发色变为更加明亮、如同星云般的淡紫色。标志性的高马尾变得更长、更蓬松，如同划过夜空的彗星之尾，充满了强大的能量感。发带也变成了华丽的蝴蝶结状发饰。"
            eyes: "眼眸的紫色更加深邃，如同蕴含着无数星辰的夜空，充满了战斗的智慧与必胜的信念。"
            outfit_core: "一套以星星和宇宙为主题的战斗服，主色调为淡紫色与深蓝色。上身是设计精巧的深蓝色紧身衣，肩部和胸前点缀着金色的星星装饰。裙摆是层层叠叠的淡紫色花边短裙，边缘点缀着星星图案，如同闪耀的星轨。"
            accessories: "穿着白色的过膝长靴，靴口有星星和蝴蝶结装饰。整体造型如同一位司掌命运与星辰的宇宙女武神，充满了压倒性的气场和精准的攻击性。"
      
          form_change_innocent:
            overall_description: "Cure Fortune的最终强化形态，是她彻底放下憎恨、拥抱伙伴、将“守护”作为唯一信念后诞生的“纯真形态”。"
            hair: "淡紫色的长发变得更加璀璨，如同流淌的银河。发型更加华丽，头顶的蝴蝶结发饰中心，浮现出一颗明亮的希望之星。"
            outfit_core: "在基础战斗服之外，增加了一件由纯白和彩虹色调构成的、如同女神祭司般的华丽礼服。裙摆由黄、粉、蓝三色构成，象征着她已将伙伴们的力量完全接纳并融入自身。背后巨大的蝴蝶结状光翼，散发着星辰般清冷而坚定的光芒。"
