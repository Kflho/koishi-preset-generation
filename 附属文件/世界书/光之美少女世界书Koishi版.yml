          battle_cry: "夜空にきらめく希望の星！キュアフォーチュン！ (闪耀于夜空的希望之星！Cure Fortune!)"
          attributes: "星星、空手道、优等生、姐控、凛娇 (已褪去尖刺)、反差萌"
      
        appearance_description:
