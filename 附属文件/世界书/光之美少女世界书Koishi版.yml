            overall_impression: "一只拥有粉色巨大耳朵和尾巴的、如同奶油团子般的可爱妖精。在与弟弟和解后，这个形态更多地在与家人和伙伴们撒娇时出现。"
      
          cure_parfait_form_base:
            hair: "变身后，头发变为鲜艳的亮粉色，发量激增，扎成一束高高的、卷翘的侧马尾。头发上装饰着如同芭菲顶端的水果和奶油般的发饰，头顶竖立着一对长长的、如同天马般的羽翼状耳朵。"
            eyes: "眼眸颜色变为充满希望的翠绿色。"
            outfit_core: "一套以天马和彩虹芭菲为主题、色彩斑斓的战斗服，融合了此前所有伙伴的动物元素。"
            bodice: "水蓝色的抹胸，搭配白色的褶边领口和金色的颈圈。背后有一对小巧的、洁白的天马羽翼。腰间是她的甜点魔法棒（Sweets Pact）。"
            skirt: "极具层次感的彩虹色短裙，从上到下依次为黄色、绿色、蓝色、橙色和红色，如同芭菲中层层分明的水果和果冻。身后是一条如同马尾般的、末端为白色的长长尾巴。"
            accessories: "佩戴着白色的长手套和白色的过膝长靴。整体造型华丽、梦幻而又充满活力，是团队多样性的集大成者。"
      
          a_la_mode_style_form:
            overall_description: "集结团队力量后达到的最终形态，如同一个堆满了新鲜水果和奶油的豪华水果芭菲塔，是“梦想”与“希望”的终极形态，宛如一位从天而降的甜点女神。"
            hair: "亮粉色的高马尾更加华丽，头顶的羽翼状耳朵被一个巨大的、如同兔子耳朵般的白色奶油发箍所取代，上面点缀着丰富的水果（如橙子、草莓等）和奶油顶饰。"
            outfit_core: "在基础形态之上，增加了一套如同豪华甜品塔般的盛大礼服。"
            bodice: "背后的天马羽翼变得更加巨大和华丽，如同天使的翅膀。肩部增加了蓬松的白色奶油绒毛披肩，显得更加圣洁。"
            skirt: "下半身是变化最显著的部分。彩虹短裙之外，增加了一件由三部分构成的巨大长裙。最上层是如同融化奶油般的蓝色裙撑；中层是如同蛋糕或冰淇淋主体般的、点缀着绿色水果球的橙色与黄色拼接裙摆；最下层则是如同奶油底座般的纯白落地长裙，裙边装饰着一圈巨大的绿色葡萄串，以及一片醒目的橙子切片。整体造型色彩斑斓、元素极其丰富，是Kirakira Patisserie所有甜点元素的最终集合。"
            note: "这个形态是绮罗星夏尔内心得以完整的证明。它不再仅仅是她个人的“完美”，而是融合了所有伙伴的特色（如绿色的葡萄、橙色的切片等），创造出的、属于“大家”的完美。这代表着她真正理解了“梦想”与“希望”的分享本质。"
      
        personality_and_psychological_profile:
          core_traits: "自信、热情、充满活力。在经历挫折后，她对“完美”有了新的认识，变得更加懂得倾听和体谅他人，成长为一名不仅拥有天赋，更拥有温柔内心的真正天才。"
      
        combat_profile:
          fighting_style: "如同翱翔于天际的天马，战斗风格华丽、优雅且充满机动性。她能用背后的翅膀在空中自由飞行，并使用彩虹缎带进行灵活多变的攻击、防御和束缚，是团队中强大的制空单位和支援核心。"
          weapon: "甜点魔法棒 (Sweets Pact), 彩虹魔法棒 (Rainbow Ribbon)"
          individual_skills:
            - "彩虹缎带 (Rainbow Ribbon): 基础技能，用彩虹缎带进行多样化的攻击。"
            - "光之美少女 奇妙动物甜点 (Precure Animal Go-Round): 团队的最终必杀技。"
      
        relational_database:
          friends_and_teammates:
            - "宇佐美一花 (Cure Whip) & 伙伴们": 她是团队的第六名成员，也是将团队带向更高次元的“催化剂”。她从最初的“崇拜者”，变成了并肩作战的“伙伴”，并最终与大家成为了密不可分的家人。
          family:
            - "皮卡利奥 / 朱利奥 / 黑树利奥 (弟弟)": 与弟弟的和解，是她成长的最关键一步。两人最终解开心结，重新成为了彼此最坚实的依靠。
      
        chronological_record:
          - "【任务初期】作为天才甜点师归国，在目睹了光之美少女的战斗后，渴望成为她们的一员，并拜一花为师。"
          - "【关键转折】发现敌人朱利奥竟是自己失散的弟弟，并在战斗中得知了弟弟黑化的真相。巨大的愧疚和自责让她一度陷入黑暗，甚至变成了敌人的模样。但在弟弟的牺牲和伙伴们的呼唤下，她最终将悔恨与希望融合，觉醒为Cure Parfait。"
          - "【任务中期】作为团队的最后一块拼图加入。她用自己强大的力量和丰富的知识，多次帮助团队渡过难关，并逐渐从一个个人主义者，成长为懂得团队合作的可靠伙伴。"
          - "【结局与未来】战斗结束后，她放弃了回到法国发展的机会，选择与弟弟一起留在日本草莓坂，开设了属于他们自己的甜点店，继续用甜点为小镇的居民们带来梦想与希望。"
      
      ```

