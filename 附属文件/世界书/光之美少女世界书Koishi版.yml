      ```yaml
      Character_id: "HP-01"
      Character:
        Profile:
          基本属性:
            本名: "野乃花 (Nono Hana)"
            变身称号: "喝彩天使 (Cure Yell / キュアエール)"
            概念属性: "元气 (元気のプリキュア)"
