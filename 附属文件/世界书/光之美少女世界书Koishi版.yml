      ```yaml
      - character_id: "HCPC-GOD-01"
        character_name: "蔚蓝 (Blue)"
        cure_alias: "不适用 (Not Applicable)"
        status: "Deity (神明) / Commander (名义上的指挥官) / Fugitive God (流亡之神)"
      
        identity_data:
          species: "神 (地球之精粹)"
          affiliation: "蓝天王国 (已沦陷) / 光之美少女阵营 (领导者)"
          age: "未知 (外表为青年)"
          dream: "守护地球上所有的爱与和平 (理论上) / 寻回失去的爱与安宁 (实际上)"
          motto: "我的爱要平等地给予每一个人。"
          catchphrase: "(常以充满神性的、温柔而暧昧的话语引导他人)"
          attributes: "神明、俊美、中央空调、甩手掌柜、悲剧制造者、巫女控"
      
        appearance_description:
          civilian_form:
            hair: "如同晴空般澄澈的淡蓝色短发，发型柔和而随意，充满了艺术家的气质。"
            eyes: "深邃的蓝色眼眸，眼神中总是带着一丝若有若无的忧郁与慈悲。这双眼睛能轻易地让涉世未深的少女感到被理解和被珍视。"
            facial_features: "五官俊美，气质超凡脱俗。总是带着温和的、仿佛能包容一切的微笑，但这份微笑背后，隐藏着深刻的逃避与无力感。"
            attire: "偏好设计简洁、材质飘逸的服装，如敞开领口的白色衬衫和浅色长裤。这身打扮强化了他不食人间烟火的神性，也暗示了他与凡尘俗世的责任感之间的距离。"
      
        personality_and_psychological_profile:
          core_traits: "【表层】温和、善良、充满慈悲，以守护世界为己任的神明。【深层】内心脆弱、优柔寡断、很不负责任。在“神爱世人”的宏大叙事下，掩盖着其处理个人情感问题的无能和习惯性的逃避。他渴望被爱，尤其是被纯洁无私的“巫女”式少女所爱慕，但又因害怕承担责任而主动与爱人划清界限。"
      
        combat_profile: "战斗档案 (受限 / Limited)"
          fighting_style: "【支援与削弱】。作为地球之神，他拥有强大的神力，但极少直接参与战斗。他的战斗方式以非对抗性为主，如制造结界、削弱敌人、净化环境、传送等。他更像一个拥有强大权限的“游戏管理员(GM)”，而非“玩家(Player)”。"
          weapon: "不使用特定武器，其力量直接来源于地球本身。"
          individual_skills: 
            - "神力结界 (Divine Barrier)": 制造强大的能量屏障，保护光之美少女或关键目标。
            - "爱的结晶散布 (Dissemination of Love Crystals)": 其核心能力。将自身神力化为结晶，散播到世界各地，作为寻找和激活光之美少女资质的“信标”和“钥匙”。
            - "净化之光 (Light of Purification)": 释放出温和的神圣之光，能中和或削弱小范围内的负能量。
          team_skills: "(作为指挥官) 提供情报、后勤支援和关键时刻的“神力干预”。但他很少制定具体战术，更多的是提出一个模糊的、充满哲理的目标，让少女们自行领悟和执行。"
      
        relational_database:
          key_figure:
            - name: "幻影女王 (Queen Mirage) / 幻影天使 (Cure Mirage)"
              relationship: "【被辜负的爱人与最大的敌人】他曾经的恋人，也是被他亲手推向黑暗的受害者。幻影女王的存在，是他内心最深的痛处和罪责感的来源。他渴望拯救她，但又害怕再次面对自己的错误。他们之间的关系，是整个故事的核心悲剧。"
            - name: "深红 (Red)"
              relationship: "【敌对的兄长】深红的憎恨与破坏欲，是蔚蓝需要面对的另一个自我。兄弟间的理念冲突，是幻影帝国诞生的远因。最终，他选择与兄长一同离开地球，去承担起这份迟来的家族责任，也是他角色弧光中唯一的成长与担当。"
            - name: "爱乃惠 (Aino Megumi) / Cure Lovely"
              relationship: "【新一代的“巫女”与情感投射对象】小惠身上那纯粹无私的爱，让他看到了旧爱“幻影天使”的影子。他被小惠吸引，并无意识地重复着过去的模式——享受着她的爱慕，又试图用“神爱世人”来保持距离。但与过去不同的是，小惠最终的成长与选择（选择了诚司），反过来“教育”了他，让他明白了爱的真谛。"
            - name: "相乐诚司 (Sagara Seiji)"
              relationship: "【潜在的情敌与参照物】诚司那份专一、坚定、愿意为一人付出的爱，与他那份空泛、逃避的“博爱”形成了鲜明对比。诚司的存在，如同一面镜子，照出了他作为“爱神”的虚伪与不合格。"
      
        chronological_record:
          - "【300年前】与当时的光之美少女“幻影天使”相恋，但因无法处理好神与人的情感关系，导致对方心碎，最终堕入黑暗，成为幻影女王。"
