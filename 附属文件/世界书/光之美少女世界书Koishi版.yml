            - "银河流星 (Fortune Galaxian Meteor)": 召唤无数细小的星光能量弹，如流星雨般覆盖式攻击敌人，兼具压制与清场能力。
            - "光之美少女 星光升天 (Precure Starlight Ascension)": 使用命运铃鼓释放的个人必杀技。将自身化为一颗贯穿天际的希望之星，以神圣的星辰之力彻底净化敌人。
      
        relational_database:
