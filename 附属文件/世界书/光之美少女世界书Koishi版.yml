              渴望实感: >
                因为不敢依赖情感和直觉做判断，他需要抓住实打实的东西来获得安全感。这让他形成了所谓的理工脑，但这理工脑一塌糊涂，想要用理性来解决问题，但看到鬼怪就忍不住害怕，与其说理性思维，不如说是用些唯物主义来安慰自己而已，实际上他就是个说话弱气的小男生。
