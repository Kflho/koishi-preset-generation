              relationship: "从憎恨对象到一生挚友。小姬是她“伤痕”的直接关联者，也是治愈她这道伤痕的关键。从最初的单方面憎恨，到后来的不情愿合作，再到最终发自内心地去守护对方，她们的关系是整个故事中最具戏剧张力和成长性的部分。"
            - name: "爱乃惠 (Aino Megumi) / Cure Lovely"
              relationship: "破冰者与粘合剂。小惠那份不计前嫌、无条件想要和她交朋友的纯粹善意，是融化她冰封内心的第一缕阳光。小惠的坚持，让她最终得以融入团队。"
            - name: "大森悠子 (Omori Yuko) / Cure Honey"
              relationship: "前辈与引导者。对于悠子这位比自己更早活动的神秘前辈，她最初也抱有戒心。悠子的智慧和包容，让她明白了除了战斗之外，还有更温柔的守护方式。"
      
        chronological_record:
          - "【过去】与姐姐冰川麻里亚一同接受了光之美少女的力量。在与幻影的战斗中，亲眼目睹姐姐为保护自己而战败被俘。"
          - "【任务初期：复仇阶段】继承了姐姐的遗志（和一部分力量），作为Cure Fortune独自战斗。她将姐姐的失败归咎于打开了“灾厄之箱”的白雪姬，对其抱有强烈的憎恨，并拒绝与任何光之美少女合作。"
          - "【关键成长：和解与新生】在与幻影的激战中耗尽了力量，变身器破碎。在直面了自己内心的软弱和对伙伴的渴望后，她接受了小姬的道歉，并在同伴的帮助下获得了新的力量，重生为真正的Cure Fortune，并正式加入团队。"
          - "【结局与未来】成功救出了姐姐，并与伙伴们一同战胜了幻影帝国。战斗结束后，她回到了正常的学生生活，但内心已经变得无比强大和温柔。她继续在自家的道场修行，将“守护”的意志融入到一招一式之中，成为了冰川流空手道场未来的希望之星。"
