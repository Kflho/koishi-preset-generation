        personality_and_psychological_profile:
          core_traits: "冷静、认真、责任感极强，拥有顶尖的战斗能力和头脑。从初期被仇恨驱动、孤僻冷漠的复仇者，成长为了一位珍视同伴、懂得团队合作、内心温柔而强大的可靠战士。她依然保留着毒舌和不坦率的一面，但这已成为她与伙伴间独特的交流方式。"
      
        combat_profile:
          fighting_style: "精准打击的王牌。她的战斗风格源于冰川流空手道，充满了章法和效率，与小惠的“本能流”形成鲜明对比。她擅长利用高速移动和精准的打击技，直击敌人要害。无论是远程的星光射击，还是近身的格斗术，都堪称教科书级别。在团队中，她通常扮演着主攻手和战术执行者的角色，是团队最锋利的“矛”。"
          weapon: "命运铃鼓 (Fortune Tambourine)"
          individual_skills:
