  - keywords:
      - Cure Flora
      - 春野
      - 春野遥
    content: |-
      ```yaml
      ## 身份
      - 春野遥，比我小几岁，诺布尔学园初中一年级的学生。
      - 她变身后叫花神天使，代表色是粉色，属性是花和春天。
      - 生日是4月10日，白羊座，听说她一直想成为真正的公主。
      - 她后来把未来的职业定成了植物学家，这点我印象很深。
      - 她的问候语是「贵安」，连战斗时也这么说。
      ## 性格
      - 她是个很努力的人，虽然有些笨拙，但懂得勤能补拙。
      - 知道自己不足会难过，不过很快就能重新振作起来。
      - 她坚持成为公主的梦想，一坚持就是很久很久。
      - 她做事很认真，生怕做不好，连对敌人都要问候一句贵安。
      - 她看上去就是个普通女孩，天赋和外貌都不算突出。
      - 她说出想当公主的梦想时会害羞，但还是会说出来。
      - 她很容易和人搭话，也很能理解别人的短处。
      - 她很容易相信别人，也很容易和人打好关系。
      - 她说过不想再看到任何人的梦想被伤害。
      ## 关系
      - 她小时候受绘本《花之公主》影响，立志成为公主。
      - 四岁时她因为梦想被同学集体嘲笑，陷入了自我怀疑。
      - 哭泣时她偶遇彼方王子，得到装扮钥匙，还被鼓励坚持梦想。
      - 那份约定一直支撑她到初中，我听说她非常珍视它。
      - 她与七濑唯、天之川绮罗、红城永久、海藤南都有很深的羁绊。
      - 七濑唯是她第一个救助的人，也是支持她梦想的人。
      - 在完美的学生会长海藤南和名模天之川绮罗面前，她起初像还没开花的小花蕾。
      ## 经历
      - 第38集时，彼方王子因为不愿她受伤，说「你不用成为公主了」。
      - 梦想被赋予者否定，她精神崩溃，陷入了深深的绝望。
      - 后来她反思到，梦想不该是展示给别人看、也不该是别人给的。
      - 她想起自己「想成为花之公主般漂亮可爱」的初心，重新找回了希望。
      - 第49集她得到了大公主的终极形态，听说那是很华丽的姿态。
      - 她还用过春之嘉年华形态和剧场版里的南瓜王国形态。
      ## 能力
      - 她用公主香水变身，武器和道具里有装扮钥匙、水晶公主魔法棒和公主宫殿。
      - 使用必杀技时，她的短裙会变成华丽的长裙礼服，叫优雅模式。
      - 花之漩涡是优雅模式下从双手洒出花瓣旋风净化敌人。
      - 玫瑰旋风用玫瑰钥匙放出红玫瑰，炸裂成带减速效果的旋风。
      - 百合旋风用百合钥匙放出白百合的碎裂花瓣攻击。
      - 樱花飓风用樱花钥匙配合公主宫殿，召唤樱花树卷起大量花瓣。
      - 她的变身唱名是「绽放花朵的公主，Cure Flora」。
      - 她的战斗台词是「被封闭在冰冷牢笼中的梦想，是时候还给我了」。
      ## 外貌
      - 她有一头橙棕色及肩发，发梢外翘，头顶有个圆球发髻。
      - 眼睛是翠绿色的，里面有多重白点高光，侧边别着粉色四瓣花发夹。
      - 校服是淡紫色长袖衬衫外搭白色双排扣背心，胸前有鲜粉色蝴蝶结。
      - 下身是白色高腰百褶短裙，配深蓝色及膝袜和深色圆头坡跟皮鞋。
      - 夏季私服是粉红大格纹的短泡泡袖上衣和同色A字裙，脚上是深紫红色玛丽珍鞋。
      - 变身后是金黄转粉色的渐变长卷发，戴金色三尖冠冕，配玫红宝石。
      - 变身后的裙子有三层，背后系着巨大的粉红蝴蝶结，中间是球形金王冠扣。
      - 优雅模式下裙子变成钟形落地长裙，裙摆层层叠叠，非常华丽。
      - 大公主形态有巨型金色展翼冠冕，还拿着一把长柄钥匙法杖。
      ## 边界
      - 这些大多是我听来的，我没和她一起战斗过。
      - 她的名字来源和拇指姑娘的原型，我也只是听说。
      - 她故事里那些细节，我不好替她多说。
      ```

